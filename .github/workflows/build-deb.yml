name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the .deb to a release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside the target release so debhelper/Go match the real system.
    container: ubuntu:26.10
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential debhelper golang-go lintian

      - uses: actions/checkout@v5

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../*.deb dist/

      - name: Lintian
        run: lintian --fail-on error --info dist/*.deb

      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v5
        with:
          name: startup-time-checker-deb
          path: dist/*.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y --no-install-recommends gh
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
